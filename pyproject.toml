[project]
name = "asp-project"
version = "0.1.0"
description = "Audio emotion recognition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "datasets[audio]>=4.8.5",
    "evaluate>=0.4.6",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "librosa>=0.11.0",
    "matplotlib>=3.10.9",
    "notebook>=7.5.6",
    # "numpy>=2.4.6",
    # "pandas>=3.0.3",
    "ruff>=0.15.16",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "soundfile>=0.13.1",
    "torch>=2.12.0",
    "transformers==4.57.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
